<!DOCTYPE html>
<!--
  HouseTap's OAuth client ID page.

  Home Assistant asks apps to identify themselves with a web page URL (the "client_id").
  During sign-in, Home Assistant fetches this page and checks that the app's redirect address
  (hahome://auth-callback) is listed below. Host this file at the exact URL set as
  oauthClientId in gradle.properties, e.g. https://<you>.github.io/ha-home/ (GitHub Pages works).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HouseTap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="redirect_uri" href="hahome://auth-callback">
  <style>
    body { font-family: system-ui, sans-serif; background: #111517; color: #f2f5f6; max-width: 640px; margin: 64px auto; padding: 0 24px; line-height: 1.5; }
    h1 { color: #4fd8b8; }
    a { color: #4fd8b8; }
  </style>
</head>
<body>
  <h1>HouseTap</h1>
  <p>A home screen and dashboard for Home Assistant on Android tablets, Fire tablets and TVs.</p>
  <p>You're seeing this page because Home Assistant shows it during sign-in. HouseTap talks only to your own Home Assistant server and never collects your data.</p>
</body>
</html>
